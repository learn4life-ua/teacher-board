name: Browser Smoke TeacherBoard Next

on:
  workflow_dispatch:

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-1.55.0-chromium
      - name: Install Playwright package
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
      - name: Install Chromium system dependencies
        run: npx playwright install-deps chromium
      - name: Install Chromium browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      - name: Start static server
        run: |
          python3 -m http.server 4173 >/tmp/teacherboard-http.log 2>&1 &
          echo $! > /tmp/teacherboard-http.pid
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:4173/preview.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/teacherboard-http.log
          exit 1
      - name: Patch smoke compatibility and Android touch diagnostics
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/browser-smoke.mjs')
          text = path.read_text()
          old = ".graph-title').last().innerText()"
          new = ".graph-title').last().textContent()"
          if old not in text:
              raise SystemExit('Expected SVG innerText assertion was not found')
          text = text.replace(old, new, 1)
          needle = "  await page.click('#deletePageBtn');assert.equal(await page.locator('#confirmActionDialog').getAttribute('open')!==null,true,`${name}: delete dialog did not open`);"
          replacement = "  if(name==='android'){\n    const hit=await page.locator('#deletePageBtn').evaluate(el=>{const r=el.getBoundingClientRect();const x=r.left+r.width/2,y=r.top+r.height/2;const top=document.elementFromPoint(x,y);return {x,y,topId:top?.id||'',topClass:top?.className||'',same:top===el||el.contains(top)};});\n    console.log('[android-delete-hit]',JSON.stringify(hit));\n    assert.equal(hit.same,true,`android: delete button center is covered by ${hit.topId||hit.topClass||'unknown element'}`);\n    await page.touchscreen.tap(hit.x,hit.y);\n  }else await page.click('#deletePageBtn');\n  await page.waitForFunction(()=>document.querySelector('#confirmActionDialog')?.hasAttribute('open'));\n  assert.equal(await page.locator('#confirmActionDialog').getAttribute('open')!==null,true,`${name}: delete dialog did not open`);"
          if needle not in text:
              raise SystemExit('Expected delete click assertion was not found')
          path.write_text(text.replace(needle, replacement, 1))
          PY
      - name: Run desktop/tablet/android smoke tests
        run: node tests/browser-smoke.mjs
