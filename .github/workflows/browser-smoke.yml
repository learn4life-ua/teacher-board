name: Browser Smoke TeacherBoard Refactor

on:
  workflow_dispatch:
  push:
    branches:
      - refactor-v1
    paths:
      - 'index.html'
      - 'js/**'
      - 'css/**'
      - 'tests/browser-smoke.mjs'
      - 'tests/page-persistence.mjs'
      - '.github/workflows/browser-smoke.yml'

permissions:
  contents: read

concurrency:
  group: teacherboard-refactor-browser-smoke
  cancel-in-progress: true

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check active JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check tests/browser-smoke.mjs
          node --check tests/page-persistence.mjs
          for file in \
            js/state.js \
            js/storage.js \
            js/store-v1.js \
            js/history.js \
            js/objects.js \
            js/core-runtime-v1.js \
            js/history-runtime-v1.js \
            js/ui-v1.js \
            js/pages-v1.js \
            js/objects-runtime-v2.js \
            js/lifecycle-v1.js \
            js/export-v1.js \
            js/interaction-bridge-v1.js \
            js/mobile.js \
            js/accessibility-v1.js; do
            echo "Checking $file"
            node --check "$file"
          done

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start static server
        run: |
          python3 -m http.server 4173 >/tmp/teacherboard-http.log 2>&1 &
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:4173/index.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/teacherboard-http.log
          exit 1

      - name: Run desktop tablet mobile smoke tests
        run: node tests/browser-smoke.mjs

      - name: Run page and persistence regression tests
        run: node tests/page-persistence.mjs
