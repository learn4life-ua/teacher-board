name: Browser Smoke TeacherBoard Next

on:
  workflow_dispatch:

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-1.55.0-chromium
      - name: Install Playwright package
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
      - name: Install Chromium system dependencies
        run: npx playwright install-deps chromium
      - name: Install Chromium browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      - name: Start static server
        run: |
          python3 -m http.server 4173 >/tmp/teacherboard-http.log 2>&1 &
          echo $! > /tmp/teacherboard-http.pid
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:4173/preview.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/teacherboard-http.log
          exit 1
      - name: Patch smoke compatibility and Android layout diagnostics
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/browser-smoke.mjs')
          text = path.read_text()
          old = ".graph-title').last().innerText()"
          new = ".graph-title').last().textContent()"
          if old not in text:
              raise SystemExit('Expected SVG innerText assertion was not found')
          text = text.replace(old, new, 1)
          needle = "  await page.click('#deletePageBtn');assert.equal(await page.locator('#confirmActionDialog').getAttribute('open')!==null,true,`${name}: delete dialog did not open`);"
          diagnostic = """  if(name==='android'){
    const layout=await page.evaluate(()=>{
      const box=id=>{const el=document.querySelector(id);if(!el)return null;const r=el.getBoundingClientRect();const s=getComputedStyle(el);return {x:r.x,y:r.y,w:r.width,h:r.height,right:r.right,bottom:r.bottom,display:s.display,position:s.position,z:s.zIndex,minWidth:s.minWidth,maxWidth:s.maxWidth};};
      return {viewport:{w:innerWidth,h:innerHeight},pagebar:box('.pagebar'),actions:box('.page-actions'),add:box('#addPageBtn'),rename:box('#renamePageBtn'),del:box('#deletePageBtn'),scene:box('#scene')};
    });
    console.log('[android-layout]',JSON.stringify(layout));
  }
  await page.click('#deletePageBtn');assert.equal(await page.locator('#confirmActionDialog').getAttribute('open')!==null,true,`${name}: delete dialog did not open`);"""
          if needle not in text:
              raise SystemExit('Expected delete click assertion was not found')
          path.write_text(text.replace(needle, diagnostic, 1))
          PY
      - name: Run desktop/tablet/android smoke tests
        run: node tests/browser-smoke.mjs
