name: Browser Smoke TeacherBoard Next

on:
  push:
    branches: [agent/reorganize-teacher-board]
    paths:
      - 'preview.html'
      - 'css/next.css'
      - 'src/**'
      - 'tests/browser-smoke.mjs'
      - '.github/workflows/browser-smoke.yml'
  pull_request:
    paths:
      - 'preview.html'
      - 'css/next.css'
      - 'src/**'
      - 'tests/browser-smoke.mjs'
      - '.github/workflows/browser-smoke.yml'

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start static server
        run: |
          python3 -m http.server 4173 >/tmp/teacherboard-http.log 2>&1 &
          echo $! > /tmp/teacherboard-http.pid
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:4173/preview.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/teacherboard-http.log
          exit 1
      - name: Run desktop/tablet/android smoke tests
        run: node tests/browser-smoke.mjs
