name: Validate TeacherBoard Next

on:
  push:
    branches:
      - agent/reorganize-teacher-board
  pull_request:
    paths:
      - 'src/**'
      - 'css/**'
      - 'preview.html'
      - 'tests/**'
      - '.github/workflows/validate-next.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find src tests -type f \( -name '*.js' -o -name '*.mjs' \) -print0)

      - name: Check module paths and preview contract
        run: node tests/static-check.mjs

      - name: Check zoom coordinate contract
        run: node tests/zoom-check.mjs

      - name: Check page history contract
        run: node tests/history-check.mjs

      - name: Check graph performance guards
        run: node tests/graph-performance-check.mjs

      - name: Check object edit panel contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'objectedit' src/objects/object-manager.js
          grep -q 'class="object-edit"' src/objects/object-manager.js
          grep -q 'bindObjectEditing' src/app.js
          grep -q '\.object-edit' css/touch.css
          if grep -q 'Редагувати текст:' src/objects/object-manager.js; then
            echo 'Legacy text prompt must not return.'
            exit 1
          fi

      - name: Check page rename dialog contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'id="renamePageDialog"' preview.html
          grep -q 'id="renamePageForm"' preview.html
          grep -q 'id="renamePageInput"' preview.html
          grep -q 'id="renamePageCancelBtn"' preview.html
          grep -q 'id="renamePageSaveBtn"' preview.html
          grep -q 'bindPageRename' src/app.js
          grep -q 'showModal' src/app.js
          grep -q '\.page-name-dialog' css/touch.css
          if grep -q "prompt('Назва сторінки:" src/app.js; then
            echo 'Legacy page rename prompt must not return.'
            exit 1
          fi
